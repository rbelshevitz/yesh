name: CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - '**/*.go'
      - '**/*.sh'
      - '**/testdata/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '**/*.go'
      - '**/*.sh'
      - '**/testdata/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - name: Install practical test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync pv rsnapshot initramfs-tools-core cpio zstd
      - run: go test -trimpath ./...
      - name: POSIX lifecycle and pipeline race checks
        if: runner.os != 'Windows'
        run: go test -race -trimpath ./cmd/yesh -run 'Test(POSIX|Linux|Pipeline)' -count=3 -timeout=240s
      - name: Pipeline parser fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./cmd/yesh -run '^$' -fuzz FuzzPipelinePreflight -fuzztime=10s -parallel=2
      - run: go vet ./...
      - run: go build -trimpath ./cmd/yesh
